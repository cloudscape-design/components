name: Codecov fork upload

on:
  workflow_run:
    workflows: ['Build, lint and test']
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  codecov-fork:
    strategy:
      matrix:
        react: [16, 18]
    uses: cloudscape-design/actions/.github/workflows/codecov-fork-upload.yml@main
    secrets: inherit
    with:
      artifact-name: coverage-report-react${{ matrix.react }}
