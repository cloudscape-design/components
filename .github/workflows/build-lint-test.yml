name: Build, lint and test

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  actions: read
  contents: read
  security-events: write

# Cancel superseded runs for the same ref to free shared runner capacity.
# Only cancel PR runs; other events get a unique group so their runs never
# cancel or drop each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build${{ matrix.react != 16 && format(' (React {0})', matrix.react) || '' }}
    strategy:
      matrix:
        react: [16, 18]
    uses: cloudscape-design/actions/.github/workflows/build-lint-test.yml@main
    secrets: inherit
    with:
      react-version: ${{ matrix.react }}
      artifact-path: pages/lib/static-default
      artifact-name: dev-pages-react${{ matrix.react }}
      coverage-artifact-name: coverage-report-react${{ matrix.react }}
